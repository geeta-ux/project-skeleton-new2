{% extends "base.html" %}

{% block title %}
Question
{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h5 class="text-muted">Section: {{ section }}</h5>
        <h3 class="fw-bold">{{ question.text }}</h3>

        <form method="post">
            {% csrf_token %}
            {% for option in question.options %}
                <div class="form-check mt-2">
                    <input class="form-check-input"
                           type="radio"
                           name="answer"
                           value="{{ forloop.counter }}">
                    <label class="form-check-label">{{ option }}</label>
                </div>
            {% endfor %}
            <button class="btn btn-dark w-100 mt-4">Next</button>
        </form>
    </div>
</div>
{% endblock %}
