{% extends "base.html" %}
{% load socialaccount %}


{% block title %}Login - CareerGuide.ai{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-4">Login</h3>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <a href="/accounts/google/login/" class="btn btn-danger w-100 mt-2">
          Sign in with Google
        </a>

        <p class="mt-3 text-center">
          Don't have an account? <a href="{% url 'users_app:sign-up' %}">Register here</a>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
